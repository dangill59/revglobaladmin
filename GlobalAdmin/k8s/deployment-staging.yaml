apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-admin
  labels:
    app: global-admin
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: global-admin
  template:
    metadata:
      labels:
        app: global-admin
        environment: staging
    spec:
      containers:
      - name: global-admin
        image: registry.digitalocean.com/scanrev/global-admin:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Staging"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__MongoDB
          valueFrom:
            configMapKeyRef:
              name: mongodb
              key: mongoDb__connectionString
        # S3 Storage Config
        - name: S3Storage__AccessKey
          valueFrom:
            secretKeyRef:
              name: rev-s3-secrets
              key: accesskey
        - name: S3Storage__SecretKey
          valueFrom:
            secretKeyRef:
              name: rev-s3-secrets
              key: secretkey
        - name: S3Storage__Bucket
          valueFrom:
            configMapKeyRef:
              name: s3
              key: s3Storage__bucket
        - name: S3Storage__Region
          valueFrom:
            configMapKeyRef:
              name: s3
              key: s3Storage__region
        - name: S3Storage__StorageRoot
          valueFrom:
            configMapKeyRef:
              name: s3
              key: s3Storage__StorageRoot
        # OpenSearch Config
        - name: OpenSearch__Url
          valueFrom:
            configMapKeyRef:
              name: elasticsearch
              key: elasticsearch__nodes__0
        - name: OpenSearch__DisableCertificateValidation
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: global-admin
  labels:
    environment: staging
spec:
  selector:
    app: global-admin
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: global-admin
  labels:
    environment: staging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  tls:
  - hosts:
    - admin.test.sonopaper.com
    secretName: global-admin-staging-tls
  rules:
  - host: admin.test.sonopaper.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: global-admin
            port:
              number: 80
