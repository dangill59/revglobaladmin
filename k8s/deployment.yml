apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-admin
  labels:
    app: global-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: global-admin
  template:
    metadata:
      labels:
        app: global-admin
    spec:
      containers:
        - name: global-admin
          image: registry.digitalocean.com/scanrev/global-admin:latest
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__MongoDB
              valueFrom:
                configMapKeyRef:
                  name: mongodb
                  key: mongoDb__connectionString
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: global-admin
spec:
  selector:
    app: global-admin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: global-admin
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - admin.sod.sonopaper.com
      secretName: global-admin-tls
  rules:
    - host: admin.sod.sonopaper.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: global-admin
                port:
                  number: 80
